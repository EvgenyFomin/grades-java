version: "3"

services:
  mysql-master:
    image: mysql:latest
    container_name: mysql-master
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=row --general-log=1 --general-log-file=/var/lib/mysql/general-log.log
    environment:
      MYSQL_ROOT_PASSWORD: 123123123
      MYSQL_DATABASE: replica-test
      MYSQL_USER: replication_user
      MYSQL_PASSWORD: 123123123
    ports:
      - "13306:3306"

  mysql-slave:
    image: mysql:latest
    container_name: mysql-slave
    depends_on:
      - mysql-master
    command: --server-id=2 --log-bin=mysql-bin --binlog-format=row --general-log=1 --general-log-file=/var/lib/mysql/general-log.log
    environment:
      MYSQL_ROOT_PASSWORD: 123123123
      MYSQL_DATABASE: replica-test
      MYSQL_USER: replication_user
      MYSQL_PASSWORD: 123123123
    ports:
      - "13307:3306"